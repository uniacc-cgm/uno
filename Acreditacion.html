
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acreditación UNIACC 2026 - Master Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; }
        
        /* Paleta Oficial UNIACC */
        :root {
            --uniacc-blue: #3E8CBF;
            --uniacc-pink: #E6007E;
            --uniacc-orange: #F37021;
            --uniacc-black: #000000;
            --uniacc-grey: #808285;
        }
        .bg-uniacc-blue { background-color: var(--uniacc-blue); }
        .bg-uniacc-pink { background-color: var(--uniacc-pink); }
        .bg-uniacc-orange { background-color: var(--uniacc-orange); }
        .text-uniacc-blue { color: var(--uniacc-blue); }
        .text-uniacc-pink { color: var(--uniacc-pink); }
        .text-uniacc-orange { color: var(--uniacc-orange); }
        .border-uniacc-blue { border-color: var(--uniacc-blue); }
        .border-uniacc-pink { border-color: var(--uniacc-pink); }
        .border-uniacc-orange { border-color: var(--uniacc-orange); }

        /* Animaciones base */
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        /* Scrollbar custom */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        /* Flip Card CSS (Glossary) */
        .perspective { perspective: 1000px; }
        .transform-style-preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        /* Image Hero styling */
        .hero-pattern {
            background-image: url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            background-color: rgba(0,0,0,0.8);
        }
        .hero-pattern-sello {
            background-image: url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            background-color: rgba(0,0,0,0.85);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- COMPONENTS REUTILIZABLES ---
        
        // Circular Progress SVG Component
        const CircularProgress = ({ percentage, color, label }) => {
            const [progress, setProgress] = useState(0);
            const radius = 36;
            const circumference = 2 * Math.PI * radius;
            
            useEffect(() => {
                const timer = setTimeout(() => setProgress(percentage), 300);
                return () => clearTimeout(timer);
            }, [percentage]);

            const offset = circumference - (progress / 100) * circumference;
            
            return (
                <div className="flex flex-col items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                    <div className="relative w-28 h-28 mb-3">
                        <svg className="w-full h-full transform -rotate-90 drop-shadow-sm" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r={radius} stroke="#f1f5f9" strokeWidth="8" fill="transparent" />
                            <circle cx="50" cy="50" r={radius} stroke={color} strokeWidth="8" fill="transparent" 
                                    strokeDasharray={circumference} strokeDashoffset={offset} 
                                    strokeLinecap="round"
                                    className="transition-all duration-1000 ease-out" />
                        </svg>
                        <div className="absolute inset-0 flex items-center justify-center flex-col">
                            <span className="font-black text-2xl" style={{color: color}}>{percentage}%</span>
                        </div>
                    </div>
                    <span className="font-bold text-sm text-gray-800 text-center uppercase tracking-wide">{label}</span>
                </div>
            );
        };

        // Flip Card Component (Glosario)
        const FlipCard = ({ term, desc, color }) => {
            const [isFlipped, setIsFlipped] = useState(false);
            return (
                <div className="relative w-full h-48 cursor-pointer group perspective" onClick={() => setIsFlipped(!isFlipped)}>
                    <div className={`w-full h-full transition-transform duration-500 transform-style-preserve-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                        {/* Front */}
                        <div className="absolute w-full h-full backface-hidden bg-white border border-gray-200 rounded-2xl shadow-sm flex flex-col items-center justify-center p-6 text-center hover:border-gray-300 transition-colors">
                            <div className="w-14 h-14 rounded-full mb-4 flex items-center justify-center shadow-inner" style={{backgroundColor: `${color}15`}}>
                                <i data-lucide="bookmark" className="w-6 h-6" style={{color: color}}></i>
                            </div>
                            <h4 className="font-bold text-lg text-gray-800">{term}</h4>
                            <p className="text-xs text-gray-400 mt-3 flex items-center"><i data-lucide="mouse-pointer-click" className="w-3 h-3 mr-1"></i> Clic para voltear</p>
                        </div>
                        {/* Back */}
                        <div className="absolute w-full h-full backface-hidden border-2 rounded-2xl shadow-md p-6 flex flex-col items-center justify-center rotate-y-180 overflow-y-auto bg-gray-50" style={{borderColor: color}}>
                            <h4 className="font-bold text-sm mb-3 uppercase tracking-wider" style={{color: color}}>{term}</h4>
                            <p className="text-sm text-gray-700 leading-relaxed text-center font-medium">{desc}</p>
                        </div>
                    </div>
                </div>
            );
        };

        // Chat Simulator Component (Simulador)
        const SimQuestion = ({ q, a }) => {
            const [revealed, setRevealed] = useState(false);
            return (
                <div className="mb-10 flex flex-col">
                    {/* Par Evaluador (Left) */}
                    <div className="flex items-end mb-6 max-w-3xl">
                        <div className="w-12 h-12 rounded-full bg-gray-200 border-2 border-white shadow-sm flex items-center justify-center mr-4 flex-shrink-0 z-10">
                            <i data-lucide="user" className="w-6 h-6 text-gray-500"></i>
                        </div>
                        <div className="bg-white p-5 rounded-3xl rounded-bl-sm border border-gray-200 shadow-sm relative text-gray-800 transform transition-transform hover:-translate-y-1">
                            <span className="text-xs font-bold text-gray-400 absolute -top-5 left-2 uppercase tracking-widest">Par Evaluador CNA</span>
                            <p className="font-medium text-[15px] leading-relaxed">"{q}"</p>
                        </div>
                    </div>
                    
                    {/* User Answer (Right) */}
                    <div className="flex items-end justify-end max-w-3xl self-end">
                        <div className="flex flex-col items-end w-full">
                            {!revealed ? (
                                <button onClick={() => setRevealed(true)} className="bg-uniacc-orange hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all transform hover:scale-105 flex items-center active:scale-95">
                                    <i data-lucide="eye" className="w-5 h-5 mr-2"></i> Pensar y Mostrar Respuesta
                                </button>
                            ) : (
                                <div className="flex items-end animate-fade-in-up">
                                    <div className="bg-blue-50 p-6 rounded-3xl rounded-br-sm border border-blue-200 shadow-md relative order-1 mr-4">
                                        <span className="text-xs font-bold text-uniacc-blue absolute -top-5 right-2 uppercase tracking-widest">Tú (Coord. Gráfico)</span>
                                        <p className="text-[15px] text-gray-800 leading-relaxed italic">«{a}»</p>
                                    </div>
                                    <div className="w-12 h-12 rounded-full bg-uniacc-blue border-2 border-white shadow-md flex items-center justify-center flex-shrink-0 order-2 z-10">
                                        <i data-lucide="mic" className="w-5 h-5 text-white"></i>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const TitleHeader = ({ title, docSource, icon }) => (
            <div className="mb-10 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div className="flex items-center">
                    <div className="p-4 rounded-xl mr-5 bg-orange-50 border border-orange-100 shadow-inner">
                        <i data-lucide={icon} className="w-8 h-8 text-uniacc-orange"></i>
                    </div>
                    <h2 className="text-3xl font-black text-gray-900 tracking-tight">{title}</h2>
                </div>
                <div className="flex items-center text-xs font-bold bg-gray-50 px-4 py-2 rounded-full border border-gray-200 text-gray-500">
                    <i data-lucide="file-text" className="w-4 h-4 mr-2 text-gray-400"></i> {docSource}
                </div>
            </div>
        );

        const RoleAlert = ({ title, children }) => (
            <div className="bg-white border-l-8 border-uniacc-pink p-8 rounded-2xl mt-10 shadow-lg relative overflow-hidden group hover:-translate-y-1 transition-transform">
                <div className="absolute -top-10 -right-10 p-4 opacity-5 group-hover:opacity-10 group-hover:rotate-12 transition-all duration-500">
                    <i data-lucide="target" className="w-48 h-48 text-uniacc-pink"></i>
                </div>
                <h4 className="flex items-center font-black text-xl mb-4 relative z-10 text-gray-900 uppercase tracking-wide">
                    <div className="bg-pink-100 p-2 rounded-lg mr-3 shadow-sm">
                        <i data-lucide="target" className="w-6 h-6 text-uniacc-pink"></i> 
                    </div>
                    Aplicación en tu rol: {title}
                </h4>
                <div className="text-gray-700 text-base space-y-4 leading-relaxed relative z-10 pl-14">
                    {children}
                </div>
            </div>
        );

        // --- MAIN APP ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('simulador');

            // ESTO ES LO QUE ARREGLA LOS ICONOS
            // Este Hook se ejecuta cada vez que el componente se renderiza o activeTab cambia
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab]);

            const menuGroups = [
                {
                    title: "Fase 1: Visión institucional",
                    items: [
                        { id: 'contexto', label: '1. Contexto y mensajes', icon: 'flag' },
                        { id: 'cna', label: '2. Orientaciones CNA', icon: 'file-text' },
                        { id: 'sello', label: '3. Sello humanista', icon: 'heart' }
                    ]
                },
                {
                    title: "Fase 2: Ecosistema",
                    items: [
                        { id: 'dip', label: '4. Investigación (DIP)', icon: 'microscope' }
                    ]
                },
                {
                    title: "Fase 3: Tu trabajo (DAVDA)",
                    items: [
                        { id: 'mi_rol', label: '5. Ficha: Mi rol', icon: 'user-check' },
                        { id: 'dtp', label: '6. Modelos DTP', icon: 'monitor' },
                        { id: 'davda', label: '7. Flujo QA y avances', icon: 'check-circle' }
                    ]
                },
                {
                    title: "Fase 4: Práctica",
                    items: [
                        { id: 'glosario', label: '8. Glosario', icon: 'book' },
                        { id: 'simulador', label: '9. Simulador entrevista', icon: 'message-square' }
                    ]
                }
            ];

            const renderContent = () => {
                switch(activeTab) {
                    case 'contexto': return <Contexto />;
                    case 'sello': return <Sello />;
                    case 'mi_rol': return <MiRol />;
                    case 'dtp': return <ModelosDTP />;
                    case 'davda': return <FlujoQA />;
                    case 'dip': return <Investigacion />;
                    case 'cna': return <OrientacionesCNA />;
                    case 'glosario': return <Glosario />;
                    case 'simulador': return <Simulador />;
                    default: return <Simulador />;
                }
            };

            return (
                <div className="flex h-screen bg-gray-50 overflow-hidden font-sans text-gray-800">
                    <div className="w-72 bg-[#0a0a0a] text-white flex flex-col shadow-2xl z-20 border-r-4 border-uniacc-orange relative">
                        {/* Decorative BG */}
                        <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')]"></div>
                        
                        <div className="p-6 bg-black/50 backdrop-blur-sm border-b border-gray-800 relative z-10">
                            <div className="flex items-center space-x-1.5 mb-4">
                                <div className="h-1.5 w-8 rounded-full bg-uniacc-orange shadow-[0_0_10px_rgba(243,112,33,0.5)]"></div>
                                <div className="h-1.5 w-8 rounded-full bg-uniacc-blue shadow-[0_0_10px_rgba(62,140,191,0.5)]"></div>
                                <div className="h-1.5 w-8 rounded-full bg-uniacc-pink shadow-[0_0_10px_rgba(230,0,126,0.5)]"></div>
                            </div>
                            <h1 className="text-2xl font-black text-white tracking-tight">UNIACC <span className="text-uniacc-orange">2026</span></h1>
                            <p className="text-[10px] text-gray-400 mt-1 uppercase tracking-[0.2em] font-bold">Ruta de aprendizaje</p>
                            
                            <div className="mt-5 p-4 bg-gray-900/80 rounded-xl border border-gray-700/50 flex items-center shadow-inner">
                                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-gray-700 to-gray-900 flex items-center justify-center mr-3 border border-gray-600">
                                    <i data-lucide="user" className="w-5 h-5 text-gray-300"></i>
                                </div>
                                <div>
                                    <p className="text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-0.5">Perfil activo</p>
                                    <p className="text-xs font-bold text-white leading-tight">Coord. Gráfica<br/>Multimedia</p>
                                </div>
                            </div>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-4 relative z-10 scrollbar-hide">
                            {menuGroups.map((group, gIdx) => (
                                <div key={gIdx} className="mb-6">
                                    <h3 className="px-6 py-2 text-[10px] font-black text-gray-500 uppercase tracking-[0.15em] mb-1">
                                        {group.title}
                                    </h3>
                                    {group.items.map(item => (
                                        <button
                                            key={item.id}
                                            onClick={() => setActiveTab(item.id)}
                                            className={`w-full flex items-center px-6 py-3 text-sm font-semibold transition-all duration-200 ${activeTab === item.id ? 'bg-gray-800/80 text-white shadow-md' : 'text-gray-400 hover:bg-gray-900/50 hover:text-gray-200'}`}
                                            style={activeTab === item.id ? {borderLeft: '4px solid var(--uniacc-orange)'} : {borderLeft: '4px solid transparent'}}
                                        >
                                            <i data-lucide={item.icon} className={`w-4 h-4 mr-4 transition-colors ${activeTab === item.id ? 'text-uniacc-orange' : 'text-gray-600'}`}></i>
                                            {item.label}
                                        </button>
                                    ))}
                                </div>
                            ))}
                        </nav>
                    </div>
                    <div className="flex-1 overflow-y-auto bg-gray-50 relative" id="main-content">
                        <div className="max-w-5xl mx-auto p-6 md:p-10 fade-in" key={activeTab}>
                            {renderContent()}
                        </div>
                    </div>
                </div>
            );
        };

        // --- SECTION CONTENT COMPONENTS ---

        const Contexto = () => (
            <div className="space-y-6">
                <TitleHeader title="1. Contexto y mensajes clave" docSource="VRACAI_MensajesClaveAcreditacion2026.pdf y VRACAI_PresentacionAcreditacion.pdf" icon="flag" />
                
                <div className="hero-pattern rounded-3xl p-10 mb-8 shadow-xl text-white flex flex-col justify-center relative overflow-hidden">
                    <div className="relative z-10 max-w-2xl">
                        <div className="inline-flex items-center px-3 py-1 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-xs font-bold mb-4 uppercase tracking-wider">
                            <i data-lucide="award" className="w-4 h-4 mr-2"></i> Lema Institucional
                        </div>
                        <h3 className="text-3xl md:text-5xl font-black mb-4 leading-tight">"Construyendo calidad,<br/><span className="text-uniacc-orange">contamos contigo</span>."</h3>
                        <p className="text-gray-300 font-medium text-lg">La acreditación no es tarea de un área, es dar "fe pública" de que hacemos lo que decimos.</p>
                    </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                        <h3 className="font-black text-xl mb-5 flex items-center text-gray-900 border-b border-gray-100 pb-3">
                            <div className="bg-blue-50 p-2 rounded-lg mr-3"><i data-lucide="calendar" className="w-5 h-5 text-uniacc-blue"></i></div>
                            Acreditación vigente
                        </h3>
                        <div className="flex items-center justify-between bg-gray-50 p-4 rounded-xl border border-gray-200 mb-3">
                            <span className="font-bold text-gray-600">Nivel Obtenido (2023)</span>
                            <span className="bg-gray-800 text-white px-3 py-1 rounded-full text-xs font-bold">BÁSICO</span>
                        </div>
                        <p className="text-sm text-gray-600 leading-relaxed">Otorgada por 3 años (hasta agosto 2026). Prorrogada por ley hasta la resolución final de la CNA.</p>
                    </div>

                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                        <h3 className="font-black text-xl mb-5 flex items-center text-gray-900 border-b border-gray-100 pb-3">
                            <div className="bg-green-50 p-2 rounded-lg mr-3"><i data-lucide="layers" className="w-5 h-5 text-green-500"></i></div>
                            Dimensiones 2026
                        </h3>
                        <ul className="space-y-3 text-sm text-gray-700 font-medium">
                            <li className="flex items-center"><i data-lucide="check" className="w-5 h-5 text-green-500 mr-3"></i> Docencia y resultados formativos</li>
                            <li className="flex items-center"><i data-lucide="check" className="w-5 h-5 text-green-500 mr-3"></i> Gestión estratégica y recursos</li>
                            <li className="flex items-center"><i data-lucide="check" className="w-5 h-5 text-green-500 mr-3"></i> Aseguramiento de la calidad</li>
                            <li className="flex items-center"><i data-lucide="check" className="w-5 h-5 text-green-500 mr-3"></i> Vinculación con el medio</li>
                        </ul>
                        <div className="mt-4 p-3 bg-red-50 rounded-lg border border-red-100 flex items-center text-red-700 text-xs font-bold">
                            <i data-lucide="x-circle" className="w-4 h-4 mr-2"></i> No nos presentamos a Investigación.
                        </div>
                    </div>
                </div>

                <h3 className="font-black text-2xl text-gray-900 mb-6 text-center">Los 3 Instrumentos Orientadores</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div className="bg-white border border-gray-200 p-8 rounded-2xl text-center hover:border-uniacc-blue transition-colors shadow-sm group">
                        <div className="w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 bg-gray-50 group-hover:bg-blue-50 transition-colors">
                            <i data-lucide="book-open" className="w-8 h-8 text-uniacc-blue"></i>
                        </div>
                        <h4 className="font-black mb-2 text-lg text-gray-900">Modelo Educativo</h4>
                        <p className="text-sm text-gray-600">Promueve el sello humanista para el siglo XXI y lineamientos pedagógicos transversales.</p>
                    </div>
                    <div className="bg-white border border-gray-200 p-8 rounded-2xl text-center hover:border-uniacc-orange transition-colors shadow-sm group">
                        <div className="w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 bg-gray-50 group-hover:bg-orange-50 transition-colors">
                            <i data-lucide="target" className="w-8 h-8 text-uniacc-orange"></i>
                        </div>
                        <h4 className="font-black mb-2 text-lg text-gray-900">Plan Estratégico</h4>
                        <p className="text-sm text-gray-600">Proyección 2026-2030 (PEI), articulado directamente con los planes de desarrollo de facultad.</p>
                    </div>
                    <div className="bg-white border border-gray-200 p-8 rounded-2xl text-center hover:border-uniacc-pink transition-colors shadow-sm group">
                        <div className="w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 bg-gray-50 group-hover:bg-pink-50 transition-colors">
                            <i data-lucide="scale" className="w-8 h-8 text-uniacc-pink"></i>
                        </div>
                        <h4 className="font-black mb-2 text-lg text-gray-900">Marco Normativo</h4>
                        <p className="text-sm text-gray-600">Estatutos y reglamentos que aseguran la formalidad de nuestros procesos operacionales.</p>
                    </div>
                </div>

                <div className="bg-red-50 border-2 border-red-200 p-8 rounded-2xl mb-8 shadow-sm">
                    <div className="flex flex-col md:flex-row gap-6 items-center">
                        <div className="w-20 h-20 rounded-full bg-white shadow-md flex items-center justify-center flex-shrink-0">
                            <i data-lucide="megaphone-off" className="w-10 h-10 text-red-500"></i>
                        </div>
                        <div className="flex-1">
                            <h3 className="font-black text-red-800 text-xl mb-4 uppercase tracking-wider">Lo que NO debes hacer al comunicar</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div className="flex items-start bg-white p-4 rounded-xl shadow-sm border border-red-100">
                                    <i data-lucide="x" className="w-5 h-5 mr-3 flex-shrink-0 text-red-500 mt-0.5"></i>
                                    <span className="text-sm text-gray-700"><strong>No prometer resultados:</strong> No anticipes años de acreditación ni decisiones de la CNA.</span>
                                </div>
                                <div className="flex items-start bg-white p-4 rounded-xl shadow-sm border border-red-100">
                                    <i data-lucide="x" className="w-5 h-5 mr-3 flex-shrink-0 text-red-500 mt-0.5"></i>
                                    <span className="text-sm text-gray-700"><strong>No improvisar cifras:</strong> Usa solo datos del Informe de Autoevaluación.</span>
                                </div>
                                <div className="flex items-start bg-white p-4 rounded-xl shadow-sm border border-red-100">
                                    <i data-lucide="x" className="w-5 h-5 mr-3 flex-shrink-0 text-red-500 mt-0.5"></i>
                                    <span className="text-sm text-gray-700"><strong>No memorizar guiones ajenos:</strong> Responde desde el conocimiento real de tu rol.</span>
                                </div>
